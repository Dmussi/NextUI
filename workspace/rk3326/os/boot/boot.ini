odroidgoa-uboot-config

# NextUI OS for the Powkiddy V10 (kernel and device tree from dArkOS)
setenv bootargs "rdinit=/init rootwait console=/dev/ttyFIQ0 quiet loglevel=3 fbcon=rotate:3 consoleblank=0 vt.global_cursor_default=0"

setenv loadaddr "0x02000000"
setenv initrd_loadaddr "0x04000000"
setenv dtb_loadaddr "0x01f00000"

load mmc 1:1 ${loadaddr} Image
load mmc 1:1 ${initrd_loadaddr} uInitrd
load mmc 1:1 ${dtb_loadaddr} rk3326-odroidgo2-linux-v11.dtb

booti ${loadaddr} ${initrd_loadaddr} ${dtb_loadaddr}
